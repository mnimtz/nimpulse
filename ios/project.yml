name: NimPulse
options:
  bundleIdPrefix: email.nimtz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: KQGPPH4S33
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NimPulse:
    type: application
    platform: iOS
    sources:
      - NimPulse/Sources
      - NimPulse/Resources
    info:
      path: NimPulse/Info.plist
      properties:
        CFBundleDisplayName: NimPulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        # Sprach-Scope für dieses Projekt bewusst DE+EN only (nicht EFIGS+NL).
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # HealthKit-Freigabetexte — erscheinen im System-Dialog, nicht optional.
        NSHealthShareUsageDescription: "NimPulse liest deine Gesundheitsdaten aus Health, um sie auszuwerten und dir verständliche Trends zu zeigen."
        NSHealthUpdateUsageDescription: "NimPulse schreibt derzeit keine Daten nach Health zurück."
        NSHealthClinicalHealthRecordsShareUsageDescription: "NimPulse liest deine Gesundheitsakte (Allergien, Medikamente, Laborwerte), um sie zusammen mit deinen anderen Health-Daten auszuwerten."
    entitlements:
      path: NimPulse/NimPulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        # "health-records" hier rein, sobald Apple das gesonderte Clinical-Health-Records-
        # Capability-Request für dieses Bundle genehmigt hat (siehe docs/HEALTHKIT.md) —
        # sonst werden die Clinical-Record-Typen in HealthKitManager still ignoriert.
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.nimtz.nimpulse
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  NimPulse:
    build:
      targets:
        NimPulse: all
    run:
      config: Debug
